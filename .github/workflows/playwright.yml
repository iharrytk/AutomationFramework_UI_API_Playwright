name: Playwright Tests

on:
  # schedule:
  #   - cron: '30 21 * * 1-4'  # Mon-Fri 8PM IST
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
  workflow_dispatch: #manual trigger button in GitHub UI
    

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install 

      - name: Install Playwright OS deps only (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install

      

      - name: Run tests
        run: npx playwright test 
        env:
          ENV: qa
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAMEEMAIL: ${{ secrets.USERNAMEEMAIL}}
          PASSWORDEMAIL: ${{ secrets.PASSWORDEMAIL}}
          API_BASEURL: ${{ secrets.API_BASEURL}}
          API_TOKEN: ${{ secrets.API_TOKEN}}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN}}
          

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_id }}
          path: reports/html-report/
          retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/
          retention-days: 30

      - name: Upload reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-labs-report-${{ github.run_id }}
          path: reporting-labs/
          retention-days: 30